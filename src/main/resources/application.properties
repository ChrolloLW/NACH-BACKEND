# ============================================
# NACH-BACKEND CONFIG
# ============================================

# DB - Mantener conexión a imsysdb (base de datos existente)
spring.datasource.url=jdbc:mysql://localhost:3306/imsysdb
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - No modificar estructura (validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.context-path=/

# JWT Configuration & Secret Key
jwt.secret=NACH_SECURE_KEY_2025
jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.pe.nach=DEBUG
